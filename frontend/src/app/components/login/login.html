<div class="login-container">
  <div class="login-form">
    <h2>Login</h2>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="loginDto.email" name="email" required />
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" [(ngModel)]="loginDto.password" name="password" required />
      </div>
      <div *ngIf="error" class="error-message">{{ error }}</div>
      <button type="submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
    </form>
    <p class="register-link">Don't have an account? <a routerLink="/register">Register here</a></p>
  </div>
</div>
