<div class="register-container">
  <div class="register-form">
    <h2>Register</h2>
    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="registerDto.email" name="email" required />
      </div>
      <div class="form-group">
        <label>Username:</label>
        <input type="text" [(ngModel)]="registerDto.username" name="username" required />
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" [(ngModel)]="registerDto.password" name="password" required />
      </div>
      <div *ngIf="error" class="error-message">{{ error }}</div>
      <button type="submit" [disabled]="loading">{{ loading ? 'Registering...' : 'Register' }}</button>
    </form>
    <p class="login-link">Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
