<nav class="navbar">
  <div class="nav-content">
    <a routerLink="/home" class="logo">TasteTest</a>
    <div class="nav-links">
      <a routerLink="/restaurants">Restaurants</a>
      <a routerLink="/feedback">Feedback</a>
      <div class="nav-auth">
        <ng-container *ngIf="isLoggedIn$ | async; else loggedOutLinks">
          <span class="username">{{ userEmail$ | async }}</span>
          <button (click)="logout()" class="logout-btn">Logout</button>
        </ng-container>
        <ng-template #loggedOutLinks>
          <a routerLink="/login">Login</a>
          <a routerLink="/register">Register</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
