name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & test backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test all modules
        run: ./mvnw -B -ntp verify

  frontend:
    name: Build frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, mfe-admin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build-push:
    name: Build & push Docker images (staging)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-service
            context: .
            dockerfile: auth-service/Dockerfile
          - service: user-service
            context: .
            dockerfile: user-service/Dockerfile
          - service: restaurant-service
            context: .
            dockerfile: restaurant-service/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: backend-original
            context: .
            dockerfile: Dockerfile
          - service: discovery-server
            context: ./discovery-server
            dockerfile: Dockerfile
          - service: config-server
            context: ./config-server
            dockerfile: Dockerfile
          - service: notification-service
            context: ./notification-service
            dockerfile: Dockerfile
          - service: agent-service
            context: ./agent-service
            dockerfile: Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: Dockerfile
          - service: mfe-admin
            context: ./mfe-admin
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tastetest-${{ matrix.service }}:staging
            ghcr.io/${{ env.IMAGE_OWNER }}/tastetest-${{ matrix.service }}:sha-${{ github.sha }}
