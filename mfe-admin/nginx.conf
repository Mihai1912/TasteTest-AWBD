server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow the shell (different origin) to embed this MFE in an iframe.
    add_header Content-Security-Policy "frame-ancestors http://localhost:4200 http://localhost:8090";
    add_header X-Frame-Options "ALLOW-FROM http://localhost:4200" always;

    # MFE proxies API calls through to the gateway, so it can run fully
    # standalone without depending on the shell's nginx.
    location /api/ {
        proxy_pass http://api-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
