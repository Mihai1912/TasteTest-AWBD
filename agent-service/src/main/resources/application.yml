spring:
  application:
    name: tastetest-agent
  ai:
    openai:
      # LM Studio exposes an OpenAI-compatible server. The Spring AI OpenAI client
      # appends "/v1/chat/completions" to base-url, so point this at the host only.
      base-url: ${OPENAI_BASE_URL:http://127.0.0.1:1234}
      # LM Studio doesn't require an API key, but Spring AI's client refuses an
      # empty value — any non-empty placeholder works.
      api-key: ${OPENAI_API_KEY:lm-studio}
      chat:
        options:
          model: ${OPENAI_MODEL:openai/gpt-oss-20b}
          max-tokens: 1024
          temperature: 0.4

server:
  port: ${SERVER_PORT:8083}

token:
  secret: ${JWT_SECRET:tastetest-awdb-dev-secret-tastetest-awdb-dev-secret-tastetest-extended-for-hs512-min-64-bytes}

vars:
  security:
    enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.agent: DEBUG
    org.springframework.ai: INFO
