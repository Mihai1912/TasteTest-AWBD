spring:
  application:
    name: tastetest-awdb
  profiles:
    active: dev   # profilul implicit; poate fi suprascris cu -Dspring.profiles.active=test
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      enabled: true
  jpa:
    show-sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME:mailtrap-user}
    password: ${MAIL_PASSWORD:mailtrap-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}

server:
  port: ${SERVER_PORT:8090}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      notificationService:
        baseConfig: default
      userService:
        baseConfig: default
  retry:
    instances:
      notificationService:
        maxAttempts: 3
        waitDuration: 2s
      userService:
        maxAttempts: 3
        waitDuration: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}

vars:
  security:
    enable: ${VARS_SECURITY_ENABLE:true}

token:
  ttl: ${TOKEN_TTL:3600000}
  secret: ${TOKEN_SECRET:change-me-local-dev-secret-change-me-local-dev-secret}

admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@admin.com}
  password: ${ADMIN_PASSWORD:admin}
