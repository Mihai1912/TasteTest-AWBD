spring:
  application:
    name: tastetest-awdb
  profiles:
    active: dev   # profilul implicit; poate fi suprascris cu -Dspring.profiles.active=test
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      enabled: true
  jpa:
    show-sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME:mailtrap-user}
    password: ${MAIL_PASSWORD:mailtrap-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8090}

vars:
  security:
    enable: ${VARS_SECURITY_ENABLE:true}

token:
  ttl: ${TOKEN_TTL:3600000}
  secret: ${TOKEN_SECRET:change-me-local-dev-secret-change-me-local-dev-secret}

admin:
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@admin.com}
  password: ${ADMIN_PASSWORD:admin}
