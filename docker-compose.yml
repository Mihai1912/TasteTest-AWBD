services:
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    environment:
      CONFIG_REPO_PATH: /config-repo
      CONFIG_SERVER_PORT: 8888
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - 8888:8888
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  tastetest-app-db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tastetest-app-db-vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_APPLICATION_NAME: tastetest-auth
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      # rely on Flyway migrations; do not use hibernate ddl-auto in containers
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8091
    ports:
      - 8091:8091
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  users:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_APPLICATION_NAME: tastetest-user
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      # rely on Flyway migrations; do not use hibernate ddl-auto in containers
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8092
    ports:
      - 8092:8092
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  restaurants:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_APPLICATION_NAME: tastetest-restaurant
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      # rely on Flyway migrations; do not use hibernate ddl-auto in containers
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8093
    ports:
      - 8093:8093
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8093/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    depends_on:
      - auth
      - users
      - restaurants
      - backend-original
    ports:
      - 8090:80
    
  backend-original:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SERVER_PORT: 8090
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    # backend-original is internal; api-gateway exposes the public port 8090

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - 4200:80

volumes:
  tastetest-app-db-vol: