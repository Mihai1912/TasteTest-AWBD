services:
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8761
    ports:
      - 8761:8761
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    environment:
      CONFIG_REPO_PATH: /config-repo
      CONFIG_SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      - discovery-server
    ports:
      - 8888:8888
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  tastetest-app-db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tastetest-app-db-vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_APPLICATION_NAME: tastetest-auth
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      # rely on Flyway migrations; do not use hibernate ddl-auto in containers
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8091
    ports:
      - 8091:8091
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  users:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_APPLICATION_NAME: tastetest-user
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      # rely on Flyway migrations; do not use hibernate ddl-auto in containers
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8092
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_COM_EXAMPLE_USER: DEBUG
    ports:
      - 8092:8092
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  restaurants:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_APPLICATION_NAME: tastetest-restaurant
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      # rely on Flyway migrations; do not use hibernate ddl-auto in containers
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8093
    ports:
      - 8093:8093
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8093/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      restaurants:
        condition: service_healthy
      backend-original:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 80
    ports:
      - 8090:80
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:80/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - config-server
      - discovery-server
      - auth
      - users
      - restaurants
      - backend-original
      - notification-service
      - agent-service
    ports:
      - 9090:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tastetest-observability.json
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  zipkin:
    image: openzipkin/zipkin:2.24.3
    ports:
      - 9411:9411
    
  backend-original:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 8090
      SPRING_CONFIG_IMPORT: "optional:configserver:"
      SPRING_DATASOURCE_URL: jdbc:postgresql://tastetest-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    # backend-original is internal; api-gateway exposes the public port 8090
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 8082
    ports:
      - 8082:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # AI Agent service (Part II §12). Spring AI + Anthropic Claude Haiku, exposes
  # POST /api/v1/agent/chat through the gateway. Tools call the live restaurant /
  # user services via load-balanced RestTemplate, propagating the caller's JWT.
  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 8083
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dummy-please-override}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    ports:
      - 8083:8083
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
      - mfe-admin
    ports:
      - 4200:80

  # Admin micro-frontend (Part II §10).
  # Independent Angular workspace, independent build, independent deploy;
  # the shell embeds it at /admin via an iframe pointing at host port 4201.
  mfe-admin:
    build:
      context: ./mfe-admin
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - 4201:80

volumes:
  tastetest-app-db-vol:
  prometheus-data:
  grafana-data:
