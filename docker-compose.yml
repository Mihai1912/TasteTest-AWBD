services:
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    environment:
      CONFIG_REPO_PATH: /config-repo
      CONFIG_SERVER_PORT: 8888
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - 8888:8888

  tastetest-app-db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tastetest-app-db-vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      config-server:
        condition: service_started
      tastetest-app-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_URL: http://config-server:8888
      SERVER_PORT: 8090
    ports:
      - 8090:8090

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - 4200:80

volumes:
  tastetest-app-db-vol: