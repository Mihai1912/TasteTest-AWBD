spring:
  application:
    name: tastetest-api-gateway
  cloud:
    gateway:
      # LLM inference can take 60-120 seconds; raise the global HTTP client
      # response timeout so the gateway does not 504 before the model replies.
      httpclient:
        response-timeout: 150s
        connect-timeout: 5000
      default-filters:
        - AddResponseHeader=X-Gateway, tastetest-api-gateway
      routes:
        - id: auth-api
          uri: lb://tastetest-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AddRequestHeader=X-Gateway-Route, auth-api
        - id: users-api
          uri: lb://tastetest-user
          predicates:
            - Path=/api/v1/user/**
          filters:
            - AddRequestHeader=X-Gateway-Route, users-api
        - id: restaurants-api
          uri: lb://tastetest-restaurant
          predicates:
            - Path=/api/v1/restaurant/**
          filters:
            - AddRequestHeader=X-Gateway-Route, restaurants-api
        - id: notifications-api
          uri: lb://tastetest-notification-service
          predicates:
            - Path=/api/internal/notifications/**
          filters:
            - RewritePath=/api/internal/notifications(?<segment>.*), /api/notifications${segment}
            - AddRequestHeader=X-Gateway-Route, notifications-api
        - id: agent-api
          uri: lb://tastetest-agent
          predicates:
            - Path=/api/v1/agent/**
          filters:
            - AddRequestHeader=X-Gateway-Route, agent-api
        - id: backend-api
          uri: lb://tastetest-awdb
          predicates:
            - Path=/api/**
          filters:
            - AddRequestHeader=X-Gateway-Route, backend-api

server:
  port: ${SERVER_PORT:80}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

token:
  secret: ${JWT_SECRET:tastetest-awdb-dev-secret-tastetest-awdb-dev-secret-tastetest-extended-for-hs512-min-64-bytes}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.example.tastetestawdb.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
