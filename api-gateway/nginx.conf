map $request_method $cors_method {
    OPTIONS 1;
    default 0;
}

server {
    listen 80;

    # Set CORS headers for all responses
    add_header 'Access-Control-Allow-Origin' 'http://localhost:4200' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Expose-Headers' 'Authorization, Content-Type, X-Gateway-Request-Id, X-Correlation-ID' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, Access-Control-Request-Method, Access-Control-Request-Headers' always;
    add_header 'Access-Control-Max-Age' '3600' always;

    # Handle CORS preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # route /api/v1/auth/* -> auth service
    location /api/v1/auth/ {
        proxy_pass http://auth:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # route /api/v1/users/* -> users service
    location /api/v1/users/ {
        proxy_pass http://users:8092;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # route /api/v1/restaurant/* -> restaurants service (singular path used by backend)
    location /api/v1/restaurant/ {
        proxy_pass http://restaurants:8093;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # fallback for other /api requests -> original backend
    location /api/ {
        proxy_pass http://backend-original:8090/;
        proxy_set_header Host $host;
    }

    # static / frontend proxy (optional)
    location / {
        return 200 'API gateway';
        add_header Content-Type text/plain;
    }
}
