server:
  port: 8093

spring:
  datasource:
    url: jdbc:postgresql://tastetest-app-db:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    table: project_schema_version
    schemas: project
